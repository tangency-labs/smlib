#
# Builds the static library and its C header (capi/) and runs the C tests on Linux x86_64, for
# speed. Every target SolidCraft ships is still built, and tested where it can run, by
# prebuilt.yml on each push to the release branch.
name: C API

on:
  push:
    branches: [main]
    paths: ['capi/**', 'source/SMLib/**', 'source/SM_API/**', '.github/workflows/capi.yml']
  pull_request:
    paths: ['capi/**', 'source/SMLib/**', 'source/SM_API/**', '.github/workflows/capi.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, runner: blacksmith-4vcpu-ubuntu-2404 }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -S capi -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake }}
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4
      - name: Smoke test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Library size
        shell: bash
        run: ls -l build/*.a
